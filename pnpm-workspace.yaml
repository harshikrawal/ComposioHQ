packages:
  - ts/e2e-tests/_utils
  - ts/e2e-tests/cli/*
  - ts/e2e-tests/cli/**/*
  - ts/e2e-tests/runtimes/node/*
  - ts/e2e-tests/runtimes/deno/*
  - ts/e2e-tests/runtimes/cloudflare/*
  - ts/examples/*
  - ts/packages/cli
  - ts/packages/cli-keyring
  - ts/packages/cli-local-tools
  - ts/packages/core
  - ts/packages/experimental
  - ts/packages/json-schema-to-effect-schema
  - ts/packages/json-schema-to-zod
  - ts/packages/slim
  - ts/packages/providers/*
  - ts/packages/ts-builders

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: false
  tree-sitter: true
  workerd: true

catalog:
  '@ai-sdk/openai': ^4.0.53
  '@arethetypeswrong/cli': ^0.18.5
  '@clack/core': '^1.4.3'
  '@clack/prompts': '^1.7.0'
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-types': ^4.20260702.1
  '@composio/client': 0.1.0-alpha.75
  '@effect/cli': ^0.77.0
  '@effect/eslint-plugin': ^0.3.2
  '@effect/language-service': ^0.87.2
  '@effect/platform': ^0.97.1
  '@effect/platform-bun': ^0.91.2
  '@effect/platform-node': ^0.108.1
  '@effect/platform-node-shared': ^0.61.1
  '@effect/vitest': ^0.30.0
  '@mastra/core': ^1.50.1
  '@modelcontextprotocol/sdk': ^1.30.0
  '@types/bun': ^1.4.0
  '@typescript/native-preview': 7.0.0-dev.20260703.1
  ai: ^7.0.14
  dotenv: ^17.4.2
  effect: ^3.22.1
  hono: ^4.13.5
  openai: ^6.45.0
  picocolors: ^1.1.1
  pnpm: ^11.25.0
  publint: ^0.3.24
  tsdown: ^0.22.14
  tsx: ^4.23.13
  typescript: ^6.0.3
  '@vitest/ui': ^4.1.11
  vitest: ^4.1.11
  wrangler: ^4.127.1
  zod: ^4.4.3
  zod-to-json-schema: ^3.25.2

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@mastra/core'
  - '@composio/client'
  - chrome-devtools-mcp

peerDependencyRules:
  allowedVersions:
    typescript: ^6.0.0
    vitest: ^4.0.0
    zod: ^4.0.0

overrides:
  qs@<6.14.1: '>=6.14.1'
  protobufjs: 7.6.5
  # temporary: @zed-industries/claude-code-acp@0.16.2 (latest) exact-pins vulnerable 10.2.1; drop when it ships >=10.2.3
  'minimatch@>=10.0.0 <10.2.3': '>=10.2.3 <11'
  # temporary: @redocly/openapi-core@1.34.x (via openapi-typescript) exact-pins vulnerable 4.2.0; drop when it ships >=4.3.0
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0 <5'
